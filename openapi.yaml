          description: "ID задачи."
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                "…":
                  type: "object"
                  description: "Те же поля, что в POST /ai-posting."
              required:
                - "…"
            example:
              name: "Советы по уходу за растениями"
              posts_amount: 20
              "…": "остальные поля как при создании"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
