      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "ID задачи."
          schema:
            type: "integer"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                success: true
      x-notes:
        - "В кабинете этой кнопки нет, но маршрут работает."
  "/ai-posting/{id}/edit":
    get:
      operationId: "ai-posting-edit"
      summary: "Данные задачи для редактирования"
      description: "Возвращает настройки задачи и справочники (страницы, проекты, расписания). С id=0 — значения по умолчанию."
      tags:
        - "ИИ-постинг"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "ID задачи; 0 — шаблон новой."
          schema:
            type: "integer"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                id: 9
                name: "Советы по уходу за растениями"
                post_topic: "Уход за комнатными растениями зимой"
                post_notes: ""
                text_model_id: 1
                text_model_key: ""
                text_limit: 1000.0
                posts_amount: 10
                images_type: 1
                images_amount: 1
                image_model_id: 1
                image_model_key: ""
                image_notes: ""
                image_style: ""
                reference_photos: []
                publication_when_type: 2
                publication_how_type: 1
                publication_where_type: 1
                schedule_id: 3
                project_id: 0
                selected_pages_by_source_ids: {}
                selected_albums_by_source_ids: {}
                social_pages_by_accounts: []
                social_albums_by_pages: []
                projects: []
                schedules:
                  - id: 3
                    name: "Будни 9–18"
      x-notes:
        - "Пока задача создаёт посты, редактировать её нельзя: ответ 403 «This task is in work now and cannot be edited.»."
  "/ai-posting/{id}/state":
    put:
      operationId: "ai-posting-state"
      summary: "Запустить или остановить задачу"
      description: "Включает или выключает задачу. Если все посты уже созданы, при запуске счётчик сбрасывается и задача начинает заново."
      tags:
        - "ИИ-постинг"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "ID задачи."
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                state:
                  type: "integer"
                  description: "1 — запустить, 0 — остановить."
                  example: 1
              required:
                - "state"
            example:
              state: 1
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                success: true
      x-notes:
        - "Ошибки тарифа и лимитов приходят как HTTP 500 с текстом в message (например, «Вы достигли максимального числа …»)."
  /cross-posting:
    get:
      operationId: "cross-posting-list"
      summary: "Список связей"
      description: "Возвращает связи кросс-постинга пользователя постранично (20 на страницу), в порядке ручной сортировки."
      tags:
        - "Кросс-постинг"
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "Номер страницы, с 1."
          schema:
            type: "integer"
          example: 1
        - name: "connection_id"
          in: "query"
          required: false
          description: "Показать одну связь по ID."
          schema:
            type: "integer"
          example: 42
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                list:
                  - id: 42
                    name: "Новости из ВК в Telegram"
                    state: 1
                    next_check_date: "06.10.2026, 14:30"
                    check_interval: 2
                    take_amount: 10
                    search_mode: 1
                    pages:
                      - source_id: 11
                        page_id: 2210
                total_rows: 1
                rows_limit: 20
                is_has_more: false
                filters_plug: []
      x-notes:
        - "state: 1 — связь запущена, 0 — остановлена."
        - "next_check_date уже отформатирована в часовом поясе пользователя (ДД.ММ.ГГГГ, ЧЧ:ММ)."
        - "pages — куда публикует связь (ID соцсети и ID страницы)."
    post:
      operationId: "cross-posting-create"
      summary: "Создать связь"
      description: "Создаёт связь кросс-постинга: источники, расписание проверки, режим сбора, куда публиковать и обработку контента."
      tags:
        - "Кросс-постинг"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Название связи."
                  example: "Новости из ВК в Telegram"
                source_resources:
                  type: "object"
                  description: "Откуда брать посты: объект «ID соцсети → ссылки, каждая с новой строки». Соцсети для парсинга: 1 ВК, 2 ОК, 6 Pinterest, 7 Instagram, 8 Tumblr, 11 Telegram, 13 Дзен, 14 TikTok, 17 YouTube, 28 Max. В ответе edit это поле — массив [{source_id, data}]."
                  example:
                    "1": "https://vk.ru/club123\nhttps://vk.ru/public456"
                    "11": "https://t.me/example_channel"
                source_resources_mode:
                  type: "integer"
                  description: "1 — брать из всех источников, 2 — при каждой проверке из одного случайного источника на сеть."
                  example: 1
                accounts_for_parsing:
                  type: "object"
                  description: "Аккаунты-парсеры: «ID соцсети → ID аккаунта». Нужны для сетей, где парсинг идёт через аккаунт (ВК, ОК, Telegram, Дзен, YouTube и др.). Может быть {}."
                  example:
                    "1": 555
                    "11": 812
                check_when_type:
                  type: "integer"
                  description: "Как проверять: 1 — по интервалу (check_interval), 2 — в указанное время (check_times)."
                  example: 1
                check_interval:
                  type: "integer"
                  description: "Интервал: 16 каждые 10 мин (Pro+), 1 полчаса, 2 час, 3 два часа, 4 три часа, 5 четыре часа, 6 раз в день, 7 два раза в день, 8 три, 9 четыре, 10 раз в неделю, 11 два раза в неделю, 12 три, 13 раз в месяц, 14 два, 15 три раза в месяц."
                  example: 2
                check_times:
                  type: "array"
                  items:
                    type: "string"
                  description: "Время проверок «ЧЧ:ММ» при check_when_type=2 (иначе [])."
                  example:
                    - "09:00"
                    - "18:30"
                take_amount:
                  type: "integer"
                  description: "Сколько постов брать за одну проверку."
                  example: 10
                copy_mode:
                  type: "integer"
                  description: "Метод копирования: 1 — копия поста, 2 — репост."
                  example: 1
                search_mode:
                  type: "integer"
                  description: "Какие посты брать: 1 новые, 2 старые, 3 лучшие, 4 случайные. После создания менять нельзя."
                  example: 1
                search_mode_direction:
                  type: "integer"
                  description: "Для search_mode=1: 1 от старых к новым, 2 от новых к старым."
                  example: 1
                determine_best_by:
                  type: "integer"
                  description: "Для search_mode=3: лучшие по 1 лайкам, 2 репостам, 3 комментариям, 4 просмотрам."
                  example: 1
                search_start_date:
                  type: "string"
                  description: "Начало периода ДД.ММ.ГГГГ. Обязателен при search_mode 2 или 4 (иначе 500 «no_dates_error»)."
                  example: "01.09.2026"
                search_stop_date:
                  type: "string"
                  description: "Конец периода ДД.ММ.ГГГГ, при search_mode 2 или 4."
                  example: "30.09.2026"
                search_likes:
                  oneOf:
                    - type: "integer"
                    - type: "string"
