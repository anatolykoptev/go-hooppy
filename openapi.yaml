                      photo: "https://example.com/a.jpg"
                      link: "https://vk.ru/id11223344"
                    pages:
                      - id: 822454
                        social_id: 75076231
                        type: "group"
                        name: "Кулинарные рецепты"
                        alias: "recipes_test"
                        photo: "https://example.com/p.jpg"
                        link: "https://vk.ru/recipes_test"
                social_albums_by_pages: []
                schedule_id: 0
                schedules:
                  - id: 101820
                    name: "Полезные советы"
                project_id: 0
                projects:
                  - id: 92384
                    name: "Выпечка для ВК и Max"
                ord_contracts: []
      x-notes:
        - "В ответе вложения идут поштучно с типами в единственном числе (photo, video, audio, document); для отправки в PUT их нужно собрать обратно в {type:'photos', data:[...]} и {type:'documents', data:[...]}."
        - "Если пост ещё обрабатывается (вложения скачиваются), вернётся 403 «The post is processing and cannot be edited.»."
  /rss-import:
    get:
      operationId: "rss-import-list"
      summary: "Список RSS-каналов"
      description: "Возвращает RSS-каналы пользователя постранично (12 на страницу)."
      tags:
        - "RSS-постинг"
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "Номер страницы."
          schema:
            type: "integer"
          example: 1
        - name: "channel_id"
          in: "query"
          required: false
          description: "Один канал по ID."
          schema:
            type: "integer"
          example: 17
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                list:
                  - id: 17
                    name: "Блог компании"
                    link: "https://example.ru/feed.xml"
                    state: 1
                    next_check_date: "06.10.2026, 15:00"
                    check_interval: 3
                    take_amount: 1
                    pages:
                      - source_id: 1
                        page_id: 1024
                total_rows: 1
                rows_limit: 12
                is_has_more: false
                filters_plug: []
                selected_filters_placeholders: []
      x-notes:
        - "state: 1 — канал запущен, 0 — остановлен."
    post:
      operationId: "rss-import-create"
      summary: "Создать RSS-канал"
      description: "Создаёт канал: лента, частота проверки, сколько записей брать, куда публиковать и обработка."
      tags:
        - "RSS-постинг"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Название канала."
                  example: "Блог компании"
                link:
                  type: "string"
                  description: "Ссылка на RSS-ленту."
                  example: "https://example.ru/feed.xml"
                check_interval:
                  type: "integer"
                  description: "Как часто проверять: 1 каждые 15 мин, 2 полчаса, 3 час, 4 два часа, 5 три часа, 6 четыре часа, 7 раз в день, 8 два раза в день, 9 три, 10 четыре, 11 раз в неделю, 12 два раза в неделю, 13 три, 14 раз в месяц, 15 два, 16 три раза в месяц. Коды не совпадают с кросс-постингом."
                  example: 3
                take_amount:
                  type: "integer"
                  description: "Сколько записей брать (код, а не число): 1 — 1, 2 — 2, 3 — 3, 4 — 5, 5 — 10, 6 — все новые (максимум 30)."
                  example: 1
                publication_when_type:
                  type: "integer"
                  description: "Когда публиковать: 1 — сразу, после проверки; 2 — по расписанию (нужен schedule_id)."
                  example: 1
                publication_how_type:
                  type: "integer"
                  description: "Куда публиковать при publication_when_type=1: 1 — вручную выбранные страницы (selected_pages_by_source_ids / selected_albums_by_source_ids); 2 — через проект (project_id)."
                  example: 1
                publication_where_type:
                  type: "integer"
                  description: "Служебное поле, в кабинете всегда 1."
                  example: 1
                selected_pages_by_source_ids:
                  type: "object"
                  description: "Только при when=1 и how=1. Объект «ID соцсети → массив ID страниц Хуппи». Нужен он или selected_albums_by_source_ids, иначе ошибка «No pages selected.»."
                  example:
                    "1":
                      - 1024
                      - 1031
                    "11":
                      - 2210
                selected_albums_by_source_ids:
                  type: "object"
                  description: "Только при when=1 и how=1. Объект «ID соцсети → массив альбомов {id, page_id}»."
                  example:
                    "1":
                      - id: 556
                        page_id: 1024
                selected_pages_ids:
                  type: "array"
                  items:
                    type: "integer"
                  description: "Альтернатива selected_pages_by_source_ids: плоский список ID страниц, соцсеть сервер определит сам. Используется, только если selected_pages_by_source_ids не передан."
                  example:
                    - 1024
                    - 2210
                project_id:
                  type: "integer"
                  description: "ID проекта. Обязателен при when=1 и how=2."
                  example: 7
                schedule_id:
                  type: "integer"
                  description: "ID расписания. Обязателен при when=2."
                  example: 3
                posts_filter:
                  type: "object"
                  description: "Фильтр статей по вложениям (CSV-поля)."
                posts_text:
                  type: "object"
                  description: "Фильтр по тексту."
                posts_upgrade:
                  type: "object"
                  description: "Что брать из статьи (CSV): части 1 заголовок, 2 текст, 3 фото, 4 ссылку."
                posts_text_modification:
                  type: "object"
                  description: "Изменение текста статей."
                posts_caption:
                  type: "string"
                  description: "Подпись к посту ('' — без подписи)."
                  example: "Больше новостей — в нашем канале"
                posts_caption_position_type:
                  type: "integer"
                  description: "Положение подписи: 1 под текстом, 2 над текстом."
                  example: 1
                posts_caption_space_type:
                  type: "integer"
                  description: "Отступ перед подписью: 1 да, 2 нет."
                  example: 1
                photos_caption:
                  type: "string"
                  description: "Подпись к фото."
                tg_buttons:
                  type: "object"
                  description: "Кнопки для Telegram: {list:[{name,link}]}."
                  example:
                    list: []
                videos_title:
                  type: "string"
                  description: "Заголовок для видео."
                posts_comment:
                  type: "string"
                  description: "Первый комментарий к посту."
                publish_comment_by_account:
                  oneOf:
                    - type: "integer"
                    - type: "boolean"
                  description: "Публиковать комментарий от имени аккаунта."
                  example: 0
                posts_photo:
                  type: "object"
                  nullable: true
                  description: "Фото, добавляемое к посту (объект загруженного файла) или null."
                posts_photo_always:
                  oneOf:
                    - type: "integer"
                    - type: "boolean"
                  description: "Добавлять фото всегда, а не только к постам без фото."
                  example: 0
                posts_hashtags:
                  type: "object"
                  description: "Хештеги."
                  example:
                    hashtags: "#новости\n#город"
                    max_amount: 5
                    selection_type: 1
                    space_type: 1
                posts_links:
                  type: "object"
                  description: "Ссылки, добавляемые к посту. Та же структура: {links, max_amount, selection_type, space_type}."
                  example:
                    links: ""
                    max_amount: 5
                    selection_type: 1
                    space_type: 1
                posts_rewrite:
                  type: "object"
                  description: "Рерайт текста ИИ."
                  example:
                    rewrite_state: 1
                    rewrite_command: ""
                    no_posts_if_no_rewrite: ""
                    rewrite_for_every_page: ""
                    text_model_id: -1
                    text_model_key: ""
                posts_location:
                  type: "object"
                  nullable: true
                  description: "Геометка Instagram: {id}."
                  example:
                    id: ""
                posts_location_vk:
                  type: "object"
                  nullable: true
                  description: "Геометка ВКонтакте: {id}."
                  example:
                    id: ""
                crop_text_type:
                  type: "integer"
                  description: "Обрезать текст: 1 нет, 2 да."
                  example: 1
                crop_text_limit:
                  type: "integer"
                  description: "До скольких символов обрезать при crop_text_type=2."
                  example: 250
                add_link_to_post_in_comment:
                  type: "integer"
                  description: "1 — добавлять ссылку на статью в комментарий."
                  example: 0
                "is_unique_content, publish_as_story, publish_as_reels, …":
                  type: "integer"
                  description: "Плоские флаги «Настроек публикации» (0/1 или CSV ID соцсетей), полный набор как в форме кабинета: is_unique_content, is_comments_disabled, publish_as_story, publish_as_story_source_ids, publish_as_reels, publish_reels_as_trial, publish_as_clips, publish_as_shorts, publish_as_article, publish_as_article_by_link, publish_in_channel, share_stories_to_feed, share_stories_to_feed_source_ids, share_reels_to_feed, share_clips_to_feed, share_clips_to_feed_with_text, share_clips_to_feed_if_no_video, share_channel_to_feed, expand_clips_title, publish_as_user, add_link_to_user, message_to_community, message_to_channel, download_vk_videos, save_vk_videos_names, plan_by_network, publish_as_carousel, publish_only_in_videos, not_publish_in_videos, repeat_video, parse_links, publish_by_account, publish_by_account_source_ids, privacy_level, youtube_category, rutube_category, donut_paid_duration, delete_posts_day, delete_posts_hour. Проще всего взять значения из ответа …/edit и передать их обратно."
                  example: 0
              required:
                - "name"
                - "link"
                - "check_interval"
                - "take_amount"
                - "publication_when_type"
                - "publication_how_type"
                - "publication_where_type"
                - "posts_filter"
                - "posts_text"
                - "posts_upgrade"
                - "posts_text_modification"
                - "posts_caption"
                - "posts_caption_position_type"
                - "posts_caption_space_type"
                - "photos_caption"
                - "tg_buttons"
                - "videos_title"
                - "posts_comment"
                - "publish_comment_by_account"
                - "posts_photo"
                - "posts_photo_always"
                - "posts_hashtags"
                - "posts_links"
                - "posts_rewrite"
                - "posts_location"
                - "posts_location_vk"
                - "crop_text_type"
                - "crop_text_limit"
                - "add_link_to_post_in_comment"
                - "is_unique_content, publish_as_story, publish_as_reels, …"
            example:
              name: "Блог компании"
              link: "https://example.ru/feed.xml"
              check_interval: 3
              take_amount: 1
              publication_when_type: 1
              publication_how_type: 2
              publication_where_type: 1
              project_id: 7
              posts_filter:
                must_have: "2"
                skip_with: ""
                skip_like: ""
              posts_text:
                black_list: ""
                white_list: ""
              posts_upgrade:
                take_only: "1,2,3"
                do_not_take: ""
                remove_from: ""
              posts_text_modification:
                carved_list: ""
                text_translate: 1
                translate_lang_to: 1
              crop_text_type: 2
              crop_text_limit: 500
              add_link_to_post_in_comment: 0
              posts_caption: ""
              posts_caption_position_type: 1
              posts_caption_space_type: 1
              photos_caption: ""
              tg_buttons:
                list: []
              videos_title: ""
              posts_comment: ""
              publish_comment_by_account: 0
              posts_photo: null
              posts_photo_always: 0
              posts_hashtags:
                hashtags: ""
                max_amount: 5
                selection_type: 1
                space_type: 1
              posts_links:
                links: ""
                max_amount: 5
                selection_type: 1
                space_type: 1
              posts_rewrite:
                rewrite_state: 1
                rewrite_command: ""
                no_posts_if_no_rewrite: ""
                rewrite_for_every_page: ""
                text_model_id: 1
                text_model_key: ""
              posts_location:
                id: ""
              posts_location_vk:
                id: ""
              is_unique_content: 0
              publish_as_story: 0
              "…": "остальные флаги настроек публикации из ответа edit"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                id: 18
      x-notes:
        - "Сервер не валидирует тело и читает поля напрямую: отсутствующий ключ приводит к ошибке 500. Надёжный путь — получить шаблон через GET …/0/edit (или …/{id}/edit), поменять нужные поля и отправить весь объект целиком, убрав справочники (social_pages_by_accounts, social_albums_by_pages, projects, schedules, watermarks)."
        - "Формат ссылки сервер не проверяет."
        - "Фильтры RSS короче, чем у кросс-постинга; полный набор повторяет форму кабинета."
        - "Ошибки тарифа и лимитов приходят как HTTP 500 с текстом в message (например, «Вы достигли максимального числа …»)."
