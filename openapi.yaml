      tags:
        - "ИИ-постинг"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "ID задачи."
          schema:
            type: "integer"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                success: true
  "/ai-posting/{id}/check":
    put:
      operationId: "ai-posting-check"
      summary: "Запустить сейчас"
      description: "Включает задачу и назначает следующий запуск на текущий момент."
      tags:
