  "/cross-posting/{id}/reset":
    put:
      operationId: "cross-posting-reset"
      summary: "Начать заново"
      description: "Только для связи, которая ищет старые посты (search_mode=2). Сбрасывает позицию поиска по всем источникам, включает связь и ставит её на проверку: окно дат проходится с начала, как у только что созданной связи."
      tags:
        - "Кросс-постинг"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "ID связи."
          schema:
            type: "integer"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                success: true
      x-notes:
        - "Настройки, статистика, логи и созданные посты не меняются. Память о взятых постах остаётся, поэтому посты, взятые за последние 2 недели, повторно не выйдут."
        - "Пока идёт проверка связи, сброс возвращает ошибку: попробуйте через минуту."
        - "Связь получает state=1, лимиты тарифа проверяются так же, как при включении."
  "/cross-posting/{id}/state":
    put:
      operationId: "cross-posting-state"
      summary: "Запустить или остановить связь"
