  /posts/schedules/batch/clear:
    post:
      operationId: "schedules-batch-clear"
      summary: "Удалить посты в расписаниях"
      description: "Запускает в фоне удаление всех неопубликованных постов в выбранных расписаниях. Сами расписания остаются."
      tags:
        - "Расписания"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                ids:
                  type: "string"
                  description: "ID расписаний через запятую."
                  example: "2871,2872"
              required:
                - "ids"
            example:
              ids: "2871,2872"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                success: true
  /posts/schedules/batch/copy:
    post:
      operationId: "schedules-batch-copy"
      summary: "Размножить расписание по страницам"
      description: "Создаёт несколько копий расписания (без постов) и раздаёт им страницы выбранного аккаунта соц. сети блоками по pages_per_schedule. Копии получают имена «<название> 1», «<название> 2» и т.д."
      tags:
        - "Расписания"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                schedule_id:
                  type: "integer"
                  description: "ID исходного расписания: его настройки и время копируются."
                  example: 2871
                source_id:
                  type: "integer"
                  description: "ID соц. сети, страницы которой раздаются."
                  example: 1
                account_id:
                  type: "integer"
                  description: "ID подключённого аккаунта этой сети, чьи страницы берутся."
                  example: 3305
                pages_per_schedule:
                  type: "integer"
                  description: "Сколько страниц в одной копии."
                  example: 15
                pages_selection_type:
                  type: "integer"
                  description: "1 — страницы по порядку, 2 — в случайном порядке."
                  example: 1
              required:
                - "schedule_id"
                - "source_id"
                - "account_id"
                - "pages_per_schedule"
                - "pages_selection_type"
            example:
              schedule_id: 2871
              source_id: 1
              account_id: 3305
              pages_per_schedule: 15
              pages_selection_type: 1
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                success: true
      x-notes:
        - "Доступно на тарифах Pro, Pro+, Premium, Ultra."
        - "Если у аккаунта нет страниц в этой сети, ошибка «Нет ни одной страницы для указанной соц. сети.»"
        - "Копии всегда используют ручной выбор страниц (publication_how_type = 1). В кабинете этот пункт сейчас скрыт."
