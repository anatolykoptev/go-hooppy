tags:
  - name: "Посты"
    description: "Создание, планирование, изменение и удаление постов, а также статистика публикаций. Публикация в соцсети выполняется асинхронно, после ответа API."
  - name: "Страницы для постинга"
    description: "Вспомогательный метод: получить id подключённых страниц, чтобы указать их в посте."
  - name: "Файлы"
    description: "Загрузка фото, видео и документов, которые потом вкладываются в посты."
  - name: "Массовая загрузка"
    description: "Создание множества постов за один запрос из файлов, таблицы или альбома ВК."
  - name: "Наборы страниц"
    description: "Наборы страниц (в API — projects) объединяют страницы соц. сетей с общими правилами обработки и публикации. Их можно выбирать при создании постов и в расписаниях."
  - name: "Расписания"
    description: "Расписание — очередь постов, которые автоматически публикуются в заданные дни и часы на выбранные страницы или набор страниц. Здесь создание и настройка расписаний, управление очередью, время для рекламы и пакетные действия."
  - name: "Кросс-постинг"
    description: "Связи, которые забирают посты из соцсетей и Telegram-каналов и публикуют их на ваши страницы. Связь проверяет источники по расписанию, фильтрует и обрабатывает контент."
  - name: "RSS-постинг"
    description: "Каналы, которые забирают новые записи из RSS-лент и публикуют их на ваши страницы."
  - name: "ИИ-постинг"
    description: "Задачи, в которых ИИ пишет посты на заданную тему (при желании с картинками) и публикует их сразу или по расписанию."
  - name: "Ошибки публикаций"
    description: "Журнал ошибок публикации постов и кросспостинга, а также ошибки и ссылки по страницам конкретного поста."

paths:
  /accounts/pages:
    get:
      operationId: "accounts-pages-list"
      summary: "Список подключённых страниц"
      description: "Возвращает страницы (группы, каналы, профили), подключённые для постинга. Поле id из этого списка передаётся в selected_pages_ids при создании поста."
      tags:
        - "Страницы для постинга"
      parameters:
        - name: "source_id"
          in: "query"
          required: false
          description: "Только страницы этой соцсети"
          schema:
            type: "integer"
          example: 1
        - name: "account_id"
          in: "query"
          required: false
          description: "Только страницы этого аккаунта"
          schema:
            type: "integer"
          example: 78453
        - name: "page"
          in: "query"
          required: false
          description: "Номер страницы списка, по 20 записей"
          schema:
            type: "integer"
          example: 1
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                list:
                  - id: 822454
                    source_id: 1
                    account_id: 78453
                    social_page_id: 75076231
                    social_page_name: "Кулинарные рецепты"
                    social_page_link: "https://vk.ru/recipes_test"
                    social_page_photo: "https://example.com/p.jpg"
                total_rows: 1
                is_has_more: false
                rows_limit: 20
      x-notes:
        - "Нужны поля: id — идентификатор страницы в Hooppy, source_id — соцсеть, social_page_name — название. Остальные поля можно игнорировать."
        - "Telegram-источники для парсинга (source_id 11) без фильтра source_id не возвращаются."
  /ai-posting:
    get:
      operationId: "ai-posting-list"
      summary: "Список задач ИИ-постинга"
      description: "Возвращает задачи ИИ-постинга постранично (20 на страницу) с прогрессом создания постов."
      tags:
        - "ИИ-постинг"
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "Номер страницы."
          schema:
            type: "integer"
          example: 1
        - name: "task_id"
          in: "query"
          required: false
          description: "Одна задача по ID."
          schema:
            type: "integer"
          example: 9
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                list:
                  - id: 9
                    name: "Советы по уходу за растениями"
                    state: 1
                    next_launch_date: "06.10.2026, 16:00"
                    posts_amount: 10
                    posts_created_amount: 4
                    errors_amount: 0
                    pages:
                      - source_id: 11
                        page_id: 2210
                total_rows: 1
                rows_limit: 20
                is_has_more: false
      x-notes:
        - "Прогресс: posts_created_amount из posts_amount."
        - "errors_amount сейчас всегда 0."
    post:
      operationId: "ai-posting-create"
      summary: "Создать задачу ИИ-постинга"
      description: "Создаёт задачу: ИИ напишет заданное число постов на тему (с картинками или без) и опубликует их."
      tags:
        - "ИИ-постинг"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Название задачи."
                  example: "Советы по уходу за растениями"
                post_topic:
                  type: "string"
                  description: "Тема постов для ИИ."
                  example: "Уход за комнатными растениями зимой"
                post_notes:
                  type: "string"
                  description: "Заметки к тексту ('' — без них)."
                  example: "Пиши коротко, с эмодзи"
                text_model_id:
                  type: "integer"
                  description: "Модель для текста. 1 — встроенная модель Хуппи (ключ не нужен); остальные ID — модели внешних сервисов (OpenRouter, fal.ai, OpenAI, Google, ChadGPT), список как в форме кабинета."
                  example: 1
                text_model_key:
                  type: "string"
                  description: "Ключ API для текстовой модели; '' для модели 1."
                text_limit:
                  type: "integer"
                  description: "Максимальный размер текста поста, символов."
                  example: 1000.0
                posts_amount:
                  type: "integer"
                  description: "Сколько постов создать: 1, 10, 20, 50, 100, 500 или 1000."
                  example: 10
                images_type:
                  type: "integer"
                  description: "1 — без картинок, 2 — создавать картинки."
                  example: 2
                images_amount:
                  type: "integer"
                  description: "Картинок на пост: 1 или 2."
                  example: 1
                image_model_id:
                  type: "integer"
                  description: "Модель для картинок (ID из списка в форме кабинета)."
                  example: 1
                image_model_key:
                  type: "string"
                  description: "Ключ API для модели картинок; при images_type=2 нужен для любой модели."
                  example: "sk-or-v1-xxxxxxxx"
                image_notes:
                  type: "string"
                  description: "Заметки к картинкам."
                  example: "Светлый фон"
                image_style:
                  type: "string"
                  description: "Стиль картинок, свободный текст."
                  example: "акварель"
                reference_photos:
                  type: "array"
                  description: "Фото-референсы (до 3): [{photo, note}], где photo — объект файла из POST /files/media/upload. [] — без референсов."
                  example: []
                publication_when_type:
                  type: "integer"
                  description: "Когда публиковать: 1 — сразу, после создания; 2 — по расписанию (нужен schedule_id)."
                  example: 1
                publication_how_type:
                  type: "integer"
                  description: "Куда публиковать при publication_when_type=1: 1 — вручную выбранные страницы (selected_pages_by_source_ids / selected_albums_by_source_ids); 2 — через проект (project_id)."
                  example: 1
                publication_where_type:
                  type: "integer"
                  description: "Служебное поле, в кабинете всегда 1."
                  example: 1
                selected_pages_by_source_ids:
                  type: "object"
                  description: "Только при when=1 и how=1. Объект «ID соцсети → массив ID страниц Хуппи». Нужен он или selected_albums_by_source_ids, иначе ошибка «No pages selected.»."
                  example:
                    "1":
                      - 1024
                      - 1031
                    "11":
                      - 2210
                selected_albums_by_source_ids:
                  type: "object"
                  description: "Только при when=1 и how=1. Объект «ID соцсети → массив альбомов {id, page_id}»."
                  example:
                    "1":
                      - id: 556
                        page_id: 1024
                selected_pages_ids:
                  type: "array"
                  items:
                    type: "integer"
                  description: "Альтернатива selected_pages_by_source_ids: плоский список ID страниц, соцсеть сервер определит сам. Используется, только если selected_pages_by_source_ids не передан."
                  example:
                    - 1024
                    - 2210
                project_id:
                  type: "integer"
                  description: "ID проекта. Обязателен при when=1 и how=2."
                  example: 7
                schedule_id:
                  type: "integer"
                  description: "ID расписания. Обязателен при when=2."
                  example: 3
              required:
                - "name"
                - "post_topic"
                - "post_notes"
                - "text_model_id"
                - "text_model_key"
                - "text_limit"
                - "posts_amount"
                - "images_type"
                - "images_amount"
                - "image_model_id"
                - "image_model_key"
                - "image_notes"
                - "image_style"
                - "reference_photos"
                - "publication_when_type"
                - "publication_how_type"
                - "publication_where_type"
            example:
              name: "Советы по уходу за растениями"
              post_topic: "Уход за комнатными растениями зимой"
              post_notes: ""
              text_model_id: 1
              text_model_key: ""
              text_limit: 1000.0
              posts_amount: 10
              images_type: 1
              images_amount: 1
              image_model_id: 1
              image_model_key: ""
              image_notes: ""
              image_style: ""
              reference_photos: []
              publication_when_type: 2
              publication_how_type: 1
              publication_where_type: 1
              schedule_id: 3
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                id: 10
      x-notes:
        - "Все поля тела обязательны: сервер читает их без проверки, отсутствующий ключ даёт ошибку 500."
        - "Ошибки тарифа и лимитов приходят как HTTP 500 с текстом в message (например, «Вы достигли максимального числа …»)."
  "/ai-posting/{id}":
    put:
      operationId: "ai-posting-update"
      summary: "Изменить задачу"
