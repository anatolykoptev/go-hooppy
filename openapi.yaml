    post:
      operationId: "posts-create"
      summary: "Создание поста"
      description: "Создаёт пост и, в зависимости от publication_when_type, сразу отправляет его на публикацию, планирует на дату или добавляет в расписание. Публикация идёт асинхронно: ответ приходит сразу после сохранения."
      tags:
        - "Посты"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                publication_when_type:
                  type: "integer"
                  description: "Когда публиковать: 1 — сейчас, 2 — в указанное время (publication_date), 3 — по расписанию (schedules_ids)"
                  example: 1
                publication_how_type:
                  type: "integer"
                  description: "Куда публиковать при when 1/2: 1 — в выбранные страницы (selected_pages_ids или selected_pages_by_source_ids), 2 — в страницы набора (project_id). При when=3 передайте 1, значение не используется"
                  example: 1
                texts:
                  type: "array"
                  description: "Тексты поста. Можно передать пустой массив, если есть вложения"
                attachments:
                  type: "array"
                  description: "Вложения поста. Можно передать пустой массив, если есть текст"
                selected_pages_ids:
                  type: "array"
                  items:
                    type: "integer"
                  description: "Для how=1: id страниц из GET /accounts/pages. Обязателен один из selected_pages_ids, selected_pages_by_source_ids или selected_albums_by_source_ids"
                  example:
                    - 822454
                    - 22543
                selected_pages_by_source_ids:
                  type: "object"
                  description: "Для how=1, альтернатива selected_pages_ids: {\"<source_id>\": [id страниц]}. Если передан, selected_pages_ids игнорируется"
                  example:
                    "1":
                      - 822454
                    "9":
                      - 22543
                selected_albums_by_source_ids:
                  type: "object"
                  description: "Для how=1: публикация фото в альбомы ВК, {\"<source_id>\": [{id: id альбома, page_id}]}"
                  example:
                    "1":
                      - id: 3311
                        page_id: 822454
                project_id:
                  type: "integer"
                  description: "Для how=2: id набора страниц (проекта). Обязателен при how=2"
                  example: 92384
                publication_date:
                  type: "object"
                  description: "Для when=2: дата и время публикации в часовом поясе пользователя. Обязателен при when=2, не может быть в прошлом"
                publication_dates:
                  type: "object"
                  description: "Для when=2 и how=1: отдельное время для конкретных страниц, {\"<page_id>\": {date, hours, minutes}}. Не применяется к рекламным постам"
                  example:
                    "22543":
                      date: "25.10.2026"
                      hours: "09"
                      minutes: "00"
                schedules_ids:
                  type: "array"
                  items:
                    type: "integer"
                  description: "Для when=3: id расписаний. Пост встаёт в первое, в остальные копируется. Обязателен при when=3"
                  example:
                    - 101820
              required:
                - "publication_when_type"
                - "publication_how_type"
                - "texts"
                - "attachments"
            example:
              publication_when_type: 2
              publication_how_type: 1
              publication_date:
                date: "25.10.2026"
                hours: "07"
                minutes: "30"
              selected_pages_ids:
                - 822454
                - 22543
              texts:
                - text: "<p>Привет! Это тестовый пост.</p>"
                  source_id: 0
              attachments:
                - type: "photos"
                  data:
                    - id: "qb0ips21yr_6f1sy4sflx"
                      type: "photo"
                      name: "qb0ips21yr_6f1sy4sflx.jpg"
                      folder: "2026-10-06"
                      file_path: "posts/photos/2026-10-06/"
                      updated_date: 1791273600
                      text: ""
                - type: "link"
                  data: "https://example.com/article"
                - type: "settings"
                  data:
                    disable_comments: true
                    pin_post: false
      responses:
        "200":
          description: "Успешный ответ"
          content:
            "application/json":
              example:
                id: 533241
      x-notes:
        - "Варианты тела: сейчас вручную — when=1, how=1 + страницы; сейчас через набор — when=1, how=2 + project_id; потом вручную — when=2, how=1 + publication_date + страницы; потом через набор — when=2, how=2 + publication_date + project_id; по расписанию — when=3 + schedules_ids."
        - "Поля texts и attachments обязательны (хотя бы пустыми массивами), иначе сервер вернёт ошибку."
        - "Медиа можно передать двумя способами: заранее загрузить через POST /files/media/upload и вложить объект из ответа, либо указать {id, url, type:'photo'} — тогда пост сначала уйдёт в обработку (сервер скачает файл), а publication_date.timestamp в списке будет 0."
        - "Объект attachments[type=settings].data — флаги публикации, все необязательны: publish_as_clips, share_clips_to_feed, share_clips_to_feed_with_text, share_clips_to_feed_if_no_video (ВК клипы); publish_as_story + publish_as_story_source_ids (CSV id сетей), share_stories_to_feed; publish_in_channel, share_channel_to_feed (канал ВК); publish_as_shorts (YouTube); publish_as_carousel (ВК); publish_only_in_videos, not_publish_in_videos, download_vk_video (ВК Видео); pin_post; plan_by_network (отправить в «отложку» соцсети, действует только при publication_when_type 2 или 3); publish_by_account (Telegram от имени аккаунта); disable_comments; repeat_type (0 — без повтора, иначе число дней) и random_content; delete_post_day/delete_post_hour (удалить через N дней/часов после публикации)."
        - "Лимит расписания — 1000 постов; если расписание сейчас пересчитывается, вернётся ошибка 403."
        - "Ошибки приходят с HTTP 500/403/404 и телом {\"message\": \"...\"}, например «No pages selected.» или «Publication date cannot be less than the current date.»."
