            x-provenance: 'fixture: testdata/live/posts.json'
        post:
            description: Accepts PostPublishNowPayload, PostPublishAtPayload, PostPublishBySchedulePayload, or PostPublishByProjectPayload.
            operationId: createPost
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PostPublishPayload'
                required: true
            responses:
                "200":
                    description: CreatePostResponse with id (unverified — no fixture).
                    x-provenance: unverified
            summary: Create a post
            tags:
