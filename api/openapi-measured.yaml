                  required: false
                  schema:
                    type: integer
                  x-provenance: 'code-comment: posts_search.go:179'
                - description: Video-duration bucket key. Keys 1-8 work; 9,10 error. Do NOT hardcode an upper bound.
                  in: query
                  name: video_duration
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'code-comment: posts_search.go:185'
                - description: 'Comma-separated: photos, videos, audios, documents, links (AND filter).'
                  in: query
                  name: content_types
                  required: false
                  schema:
                    type: string
                  x-provenance: 'code-comment: posts_search.go:188'
                - description: Comma-separated — exclude posts with these types.
                  in: query
                  name: content_types_exclude
                  required: false
                  schema:
                    type: string
                  x-provenance: 'code-comment: posts_search.go:191'
                - description: 'PHANTOM: accepted and silently ignored on /posts-search. (source_id IS honoured on /posts and /accounts.)'
                  in: query
                  name: source_id
                  required: false
                  schema:
                    type: integer
