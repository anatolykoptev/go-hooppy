            x-provenance: 'fixture: testdata/live/notifications.json'
        x-provenance: 'code-comment: endpoints.go:37'
    /posts:
        get:
            description: Returns the paging envelope {list, total_rows, is_has_more, rows_limit} plus filters_plug and selected_filters_placeholders. publication_date.timestamp is 10 hours behind the displayed slot while source_timestamp is the real one (#110). Phantom parameters page_id and account_id are accepted and silently ignored.
            operationId: getPosts
            parameters:
                - description: Filter by schedule. Honoured.
                  in: query
                  name: schedule_id
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: Filter by project. Honoured.
                  in: query
                  name: project_id
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: 0 = unpublished, 1 = published. Honoured.
                  in: query
                  name: is_published
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: dd.mm.yyyy. Honoured.
                  in: query
                  name: publication_date
                  required: false
                  schema:
                    type: string
                  x-provenance: 'measured-live: 2026-07-30'
                - description: Filter by social network. Honoured on /posts (but phantom on /posts-search).
                  in: query
                  name: source_id
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: 1-indexed page number.
                  in: query
                  name: page
                  required: false
                  schema:
                    type: integer
                  x-provenance: unverified
                - description: Page size. Response echoes as rows_limit. Server default 20. Honoured to at least 1000.
                  in: query
                  name: limit
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: 'PHANTOM: accepted and silently ignored. An impossible id returns the full collection that looks filtered.'
                  in: query
                  name: page_id
                  required: false
                  schema:
                    type: integer
                  x-phantom: true
                  x-provenance: 'code-comment: posts.go:63'
                - description: 'PHANTOM on /posts: accepted and silently ignored. (account_id IS honoured on /accounts/pages — opposite behaviour, same name.)'
                  in: query
                  name: account_id
                  required: false
                  schema:
                    type: integer
                  x-phantom: true
                  x-provenance: 'code-comment: posts.go:63'
            responses:
                "200":
                    content:
