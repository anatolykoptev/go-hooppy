info:
    contact:
        name: go-hooppy client
        url: https://github.com/anatolykoptev/go-hooppy
    description: |-
        OpenAPI 3.1 document describing the Hooppy API as MEASURED, not as advertised. Response schemas are derived from recorded fixtures by a generator (cmd/specgen). Every entry carries x-provenance. The vendor's official spec (hooppy.ru/openapi.yaml v0.1.0) declares 9 paths; this spec covers those plus undocumented endpoints discovered via API probing.

        LIMITS, so a consumer does not over-trust this document. Each schema is derived from ONE recorded response, and the recorder reduces every array to a single element: `required` therefore lists the keys that response happened to carry, and `items` describes that one element. A field the server omits sometimes is still listed as required here, so a strictly-validating generated client will reject real traffic. A field that was null on the recording account has an unmeasured type. Where an endpoint has two recorded shapes the response schema is an anyOf over both — anyOf, not oneOf, because a derived empty form is a subset of the populated one rather than disjoint from it. Treat this as a floor on what the API returns, not a contract.
    license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0.html
    title: Hooppy API — Measured Specification
    version: 0.1.0-measured
openapi: 3.1.0
paths:
    /accounts:
        get:
            description: Returns the paging envelope {list, total_rows, is_has_more, rows_limit}. The list items carry credential-bearing fields (access_token, access_token_secret, access_web_token, password, bot_token, refresh_token, tw_app_secret, wp_app_password, and more) — a client must not surface them.
            operationId: getAccounts
            parameters:
                - description: 'Filter by social network type. Honoured: a non-zero value narrows the result set.'
                  in: query
                  name: source_id
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: 1-indexed page number.
                  in: query
                  name: page
                  required: false
                  schema:
                    type: integer
                  x-provenance: unverified
                - description: Page size. The response echoes this as rows_limit. Server default is 20. Honoured to at least 1000 (measured). This is why every walk was 50× more expensive than needed (#125).
                  in: query
                  name: limit
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountsListResponse'
                    description: List of accounts with paging envelope.
                    x-fixture:
                        testdata/live/accounts.json: '#/components/schemas/AccountsListResponse'
                    x-provenance: 'fixture: testdata/live/accounts.json'
            summary: List connected social network accounts
            tags:
                - Accounts
            x-provenance: 'fixture: testdata/live/accounts.json'
        x-provenance: 'code-comment: endpoints.go:5'
        x-vendor-spec: true
    /accounts/pages:
        get:
            description: Returns the paging envelope. Each page item carries access_token and access_token_secret — a client must not surface them. Each item also embeds the full parent account object under .account, which carries all credential fields.
            operationId: getPages
            parameters:
                - description: Filter by social network type.
                  in: query
                  name: source_id
                  required: false
                  schema:
                    type: integer
                  x-provenance: unverified
                - description: 'Filter by account. Honoured: a non-zero value narrows the result set.'
                  in: query
                  name: account_id
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: 1-indexed page number.
                  in: query
                  name: page
                  required: false
                  schema:
                    type: integer
                  x-provenance: unverified
                - description: Page size. Response echoes as rows_limit. Server default 20.
                  in: query
                  name: limit
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PagesListResponse'
                    description: List of pages with paging envelope.
                    x-fixture:
                        testdata/live/accounts_pages.json: '#/components/schemas/PagesListResponse'
                    x-provenance: 'fixture: testdata/live/accounts_pages.json'
            summary: List connected social network pages/groups
            tags:
                - Accounts
            x-provenance: 'fixture: testdata/live/accounts_pages.json'
        x-provenance: 'code-comment: endpoints.go:6'
        x-vendor-spec: true
    /accounts/pages/{id}:
        delete:
            description: Undocumented. A non-existent page returns success.
            operationId: disconnectPage
            parameters:
                - description: Page ID.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: integer
                  x-provenance: 'code-comment: endpoints.go:38'
            responses:
                "200":
                    description: Delete response (unverified — no fixture).
                    x-provenance: unverified
            summary: Disconnect a social network page
            tags:
                - Accounts
            x-provenance: 'code-comment: accounts.go:187'
        x-provenance: 'code-comment: endpoints.go:38'
    /cross-posting:
        get:
            description: 'The cross-posting rule engine: collects from a source on a timer, ranks by engagement, filters by threshold, deduplicates and publishes into a schedule. Integer enums (search_mode, search_mode_direction, determine_best_by, check_when_type, check_interval) carry no names on the wire; the client decodes them alongside the raw value. last_check_date and instagram_last_check_date arrive as a number, a numeric string, or null.'
            operationId: getCrossPostings
            parameters:
                - description: 1-indexed page number.
                  in: query
                  name: page
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'code-comment: crossposting.go:24'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CrossPostingsListResponse'
                    description: Cross-posting connections with paging envelope.
                    x-fixture:
                        testdata/live/cross_postings.json: '#/components/schemas/CrossPostingsListResponse'
                    x-provenance: 'fixture: testdata/live/cross_postings.json'
            summary: List cross-posting connections
            tags:
                - CrossPosting
            x-provenance: 'fixture: testdata/live/cross_postings.json'
        x-provenance: 'code-comment: endpoints.go:56'
    /cross-posting/{id}/edit:
        get:
            description: 'Carries the whole rule: source, targets, thresholds, schedule binding and filters. Fields that are null on the recording account have unmeasured types — a null here means not observed, not nullable by contract.'
            operationId: getCrossPostingEdit
            parameters:
                - description: Cross-posting connection ID.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: integer
                  x-provenance: 'code-comment: endpoints.go:57'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CrossPostingEditResponse'
                    description: Full editable state of one cross-posting connection.
                    x-fixture:
                        testdata/live/cross_posting_edit.json: '#/components/schemas/CrossPostingEditResponse'
                    x-provenance: 'fixture: testdata/live/cross_posting_edit.json'
            summary: Get a cross-posting connection's full editable state
            tags:
                - CrossPosting
            x-provenance: 'fixture: testdata/live/cross_posting_edit.json'
        x-provenance: 'code-comment: endpoints.go:57'
    /cross-posting/{id}/statistics:
        get:
            description: Per-connection collection and publication counters. The empty form returns statistics as an empty array, so a consumer must not assume the populated shape.
            operationId: getCrossPostingStatistics
            parameters:
                - description: Cross-posting connection ID.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: integer
                  x-provenance: 'code-comment: endpoints.go:58'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                anyOf:
                                    - $ref: '#/components/schemas/CrossPostingStatisticsResponse'
                                    - $ref: '#/components/schemas/CrossPostingStatisticsEmptyResponse'
                    description: Statistics for one connection. The empty form is a distinct shape, recorded separately.
                    x-fixture:
                        testdata/live/cross_posting_statistics.json: '#/components/schemas/CrossPostingStatisticsResponse'
                        testdata/live/cross_posting_statistics_empty.json: '#/components/schemas/CrossPostingStatisticsEmptyResponse'
                    x-provenance: 'fixture: testdata/live/cross_posting_statistics.json'
            summary: Get a cross-posting connection's statistics
            tags:
                - CrossPosting
            x-provenance: 'fixture: testdata/live/cross_posting_statistics.json'
        x-provenance: 'code-comment: endpoints.go:58'
    /files/documents/upload:
        post:
            description: Multipart form upload. Max 50 MB (MaxUploadBytes).
            operationId: uploadDocument
            responses:
                "200":
                    description: UploadDocumentResponse (unverified — no fixture).
                    x-provenance: unverified
            summary: Upload a document file (multipart)
