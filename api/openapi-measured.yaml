            x-provenance: 'code-comment: endpoints.go:14'
        x-provenance: 'code-comment: endpoints.go:14'
        x-vendor-spec: true
    /posts-search:
        get:
            description: Elasticsearch-backed search. The result window is from + size <= 10000; past it the server returns 500 'Result window is too large'. total_rows reports 10000 as a CEILING, not a count — is_has_more never clears past the window, so the envelope cannot detect the end. Three phantom parameters (source_id, source_resource_id, owner_id) are accepted and silently ignored. The paging envelope DROPS is_has_more on this endpoint (see fixture — it carries is_has_more but total_rows is capped).
            operationId: searchPosts
            parameters:
                - description: Full-text search.
                  in: query
                  name: text
                  required: false
                  schema:
                    type: string
                  x-provenance: 'code-comment: posts_search.go:82'
                - description: dd.mm.yyyy.
                  in: query
                  name: date_from
                  required: false
                  schema:
                    type: string
                  x-provenance: 'code-comment: posts_search.go:85'
                - description: dd.mm.yyyy.
                  in: query
                  name: date_to
                  required: false
                  schema:
                    type: string
                  x-provenance: 'code-comment: posts_search.go:88'
                - description: 1=social, 2=RSS. An impossible enum value is NOT a probe — the server ignores unrecognised values and returns everything.
                  in: query
                  name: source_type
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'code-comment: posts_search.go:106'
                - description: publication_date, likes, reposts, comments, views, involvement. Honoured.
                  in: query
                  name: sort_by
                  required: false
                  schema:
                    type: string
                  x-provenance: 'measured-live: 2026-07-30'
                - description: desc (default) or asc.
                  in: query
                  name: sort_direction
                  required: false
                  schema:
                    type: string
                  x-provenance: 'code-comment: posts_search.go:118'
                - description: 1-indexed. Offset paging past the ES window (from + size > 10000) returns 500.
                  in: query
                  name: page
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'code-comment: posts_search.go:109'
                - description: Page size (ES size). Response echoes as rows_limit. Honoured to at least 1000. Server default 20. from + size <= 10000 enforced by Elasticsearch.
                  in: query
                  name: limit
                  required: false
                  schema:
                    type: integer
                  x-provenance: 'measured-live: 2026-07-30'
                - description: 'Photo-count bucket key. Pass-through: valid key space not enumerable client-side.'
                  in: query
